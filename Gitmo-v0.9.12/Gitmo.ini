[Gitmo]
; 1 = Gitmo is active, 0 = it loads but does nothing.
Enabled=1
; Key that opens and closes the Gitmo phone, e.g. Delete, Insert, Home, End,
; PageUp, PageDown, F1 - F12, a letter or digit. Easiest to change on the
; phone itself: Settings > Controls > Change.
MenuKey=Delete
; Phone colours: light or dark. Also switchable in the phone's Settings.
Theme=light
; 1 = send and receive money with other players who have Gitmo (over Steam).
Transfers=1
; 1 = play the notification sound when someone sends you money (also on the phone:
; Settings > Notifications).
NotifyMode=sound
; 1 = only players in your game session can send you money or be sent money.
; 0 = any Steam friend playing SnowRunner who has Gitmo.
SessionOnly=1
; 1 = when money leaves your balance (a transfer you sent), press Esc for the game once,
; so a shop or garage menu that's open backs out and shows the new balance when
; reopened (otherwise it could still sell you things with the money you sent).
; With no menu open this opens the pause menu. 0 = don't.
EscapeOnSend=1
; How that Esc reaches the game: both, directinput or window.
EscapeVia=both
; Where the phone shows: auto (in the VR headset when VR is running, otherwise on
; the screen), screen (always flat), headset.
Display=auto
; 1 = keep photos you take with the phone's camera: on Steam in your Steam
; screenshots for SnowRunner (like F12), on Epic or other stores in your
; Pictures\Gitmo folder. 0 = they're only in the chat.
SavePhotos=1
; 1 = write Gitmo.log next to this file.
Log=1
; Developer research logging. Leave off.
Research=0
